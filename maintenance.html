<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>האתר בשיפוצים</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0d1b38;
      color: #f4f7ff;
      text-align: center;
    }
    .page {
      max-width: 720px;
      padding: 32px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 4vw, 4.5rem);
      letter-spacing: 0.05em;
    }
    p {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.7;
      color: #d8dff3;
    }
    .card {
      margin-top: 28px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>האתר בשיפוצים</h1>
      <p>אנחנו עובדים על שדרוג האתר ונחזור בקרוב.</p>
    </div>
  </div>
</body>
</html>
